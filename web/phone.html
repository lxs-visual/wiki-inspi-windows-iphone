<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Envoyer à Inspi</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f10">
<style>
body{padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:18px;min-height:150px;text-align:center;color:var(--mute);cursor:pointer;position:relative;overflow:hidden}
.pick b{color:var(--ink);font-size:18px}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.previews{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.previews img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
textarea{min-height:90px;resize:vertical}
.send{padding:1em;font-size:17px;border-radius:16px}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.recent a{display:block;text-decoration:none;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.recent img{width:100%;height:100%;object-fit:cover}
.recent .txt{padding:8px;font-size:11px;color:var(--mute);overflow:hidden;height:100%}
.hint{border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:13px}
.hint b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="brand"><i></i>Inspi</div><a href="/"><button class="ghost">Galerie →</button></a></div>

  <label class="pick" id="pick">
    <input type="file" id="files" accept="image/*,video/*" multiple>
    <b>📷 Choisir des images ou vidéos</b>
    <span>captures, photos, enregistrées depuis Insta ou Pinterest</span>
  </label>
  <div class="previews" id="prev"></div>

  <textarea id="text" placeholder="…ou colle un lien (Pinterest, Behance, site…), un texte, une citation, une idée"></textarea>
  <input id="note" placeholder="Note perso (facultatif) : pour quel projet, pourquoi ça te plaît">
  <button class="primary send" id="send">Envoyer au PC</button>

  <div class="hint" id="hint"><b>Astuce :</b> dans Safari, touche <b>Partager → Sur l'écran d'accueil</b> pour avoir Inspi comme une appli. Et pour envoyer en un geste depuis n'importe quelle appli, installe le Raccourci (voir la page d'appairage sur le PC).</div>

  <div class="mono">Derniers ajouts</div>
  <div class="recent" id="recent"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}
if(navigator.standalone) $("#hint").hidden = true;

$("#files").onchange = () => {
  $("#prev").innerHTML = "";
  [...$("#files").files].slice(0,12).forEach(f => {
    const el = f.type.startsWith("video/") ? Object.assign(document.createElement("video"), {muted:true, playsInline:true}) : new Image();
    el.src = URL.createObjectURL(f); el.style.cssText = "width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px"; $("#prev").append(el); });
};

$("#send").onclick = async () => {
  const files = [...$("#files").files], text = $("#text").value.trim(), note = $("#note").value.trim();
  if(!files.length && !text) return toast("Choisis une image ou écris un texte");
  const b = $("#send"); b.disabled = true; b.textContent = files.some(f=>f.type.startsWith("video/")) ? "Envoi de la vidéo…" : "Envoi…";
  const fd = new FormData();
  files.forEach(f => fd.append("file", f));
  fd.append("text", text); fd.append("note", note); fd.append("source", "iphone");
  try{
    const r = await fetch("/api/capture", {method:"POST", body:fd, credentials:"same-origin"});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error);
    toast("✓ " + j.message);
    $("#files").value = ""; $("#prev").innerHTML = ""; $("#text").value = ""; $("#note").value = "";
    recent();
  }catch(e){ toast("Échec : " + (e.message || "PC injoignable")) }
  b.disabled = false; b.textContent = "Envoyer au PC";
};

async function recent(){
  const r = await fetch("/api/items?limit=9", {credentials:"same-origin"});
  if(!r.ok) return;
  const items = await r.json();
  $("#recent").innerHTML = items.map(it => `<a href="/">${it.type==="image" ? `<img src="/media/${it.id}/thumb" alt="">` : `<div class="txt">${esc((it.text||"").slice(0,120))}</div>`}</a>`).join("");
}
recent();
</script>
</body>
</html>
